name: CI & Code Hygiene Gatekeeper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Hygiene & Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. Code Formatting Check (Prettier)
        run: pnpm run format:check

      - name: 2. Anti-Duplication & DRY Audit (jscpd)
        run: pnpm run check:duplication

      - name: 3. Documentation Integrity & Hygiene
        run: pnpm run check:docs

      - name: 4. Strict Typecheck (All Packages)
        run: pnpm run typecheck

      - name: 5. Unit & Integration Tests
        run: pnpm run test

      - name: 6. Production Bundle Build
        run: pnpm run build
